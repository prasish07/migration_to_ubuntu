version: '3.8'
services:
  postgres:
    image: docker.io/library/postgres:15
    environment:
      POSTGRES_DB: seatflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
