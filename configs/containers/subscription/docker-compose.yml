version: "3.9"

# subscription project — postgres 16 + redis
# Containers: subscription-postgres, subscription-redis
# Generated from: podman inspect (no original compose file existed)

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: subscription-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: subscription
      POSTGRES_PASSWORD: subscription
      POSTGRES_DB: subscription_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: subscription-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pgdata:
  redis_data:
